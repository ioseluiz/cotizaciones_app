<!DOCTYPE html>
<html>
<head>
<style>
    body { font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; color: #2D3748; line-height: 1.3; margin: 0; padding: 0; }
    .annex-title { width: 100%; border-collapse: collapse; margin-top: 30px; margin-bottom: 12px; }
    .annex-title td { background-color: {{ accent }}; color: white; padding: 6px 8px; font-size: 12px;
        font-weight: bold; text-transform: uppercase; border: 1px solid {{ accent }}; }
    .annex-body { font-size: 11px; color: #2D3748; }
</style>
</head>
<body>
    <table class="annex-title" width="100%"><tr><td>{{ heading }}</td></tr></table>
    <div class="annex-body">{{ contenido }}</div>
</body>
</html>
