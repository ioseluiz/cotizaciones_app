name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  # ─── Windows: PyInstaller + Inno Setup ────────────────────────────────────
  build-windows:
    name: Build Windows Installer
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Get version
        shell: bash
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> $GITHUB_ENV

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build executable
        run: pyinstaller cotizaciones.spec
        env:
          APP_VERSION: ${{ env.VERSION }}

      - name: Build Inno Setup installer
        shell: cmd
        run: |
          "%ProgramFiles(x86)%\Inno Setup 6\ISCC.exe" ^
            /DAppVersion=${{ env.VERSION }} ^
            /O"installer\windows\Output" ^
            "installer\windows\setup.iss"

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: installer/windows/Output/CotizacionesApp-Setup-v${{ env.VERSION }}.exe
          retention-days: 1

  # ─── macOS: PyInstaller + create-dmg ──────────────────────────────────────
  build-mac:
    name: Build macOS DMG
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Get version
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> $GITHUB_ENV

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller
          brew install create-dmg

      - name: Build .app bundle
        run: pyinstaller cotizaciones.spec
        env:
          APP_VERSION: ${{ env.VERSION }}

      - name: Build DMG
        working-directory: installer/mac
        run: |
          APP_VERSION=${{ env.VERSION }} bash build_dmg.sh
          mv CotizacionesApp-v${{ env.VERSION }}.dmg ../../

      - name: Upload macOS DMG
        uses: actions/upload-artifact@v4
        with:
          name: macos-dmg
          path: CotizacionesApp-v${{ env.VERSION }}.dmg
          retention-days: 1

  # ─── GitHub Release con ambos artefactos ──────────────────────────────────
  create-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [build-windows, build-mac]
    steps:
      - uses: actions/checkout@v4

      - name: Get version
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> $GITHUB_ENV

      - name: Download Windows installer
        uses: actions/download-artifact@v4
        with:
          name: windows-installer
          path: artifacts/

      - name: Download macOS DMG
        uses: actions/download-artifact@v4
        with:
          name: macos-dmg
          path: artifacts/

      - name: Extract changelog for esta version
        id: changelog
        run: |
          VERSION=${{ env.VERSION }}
          NOTES=$(awk "/^## \[${VERSION}\]/{flag=1; next} /^## \[/{flag=0} flag" CHANGELOG.md)
          echo "NOTES<<EOF" >> $GITHUB_OUTPUT
          echo "$NOTES" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ github.ref_name }}" \
            --title "CotizacionesApp v${{ env.VERSION }}" \
            --notes "${{ steps.changelog.outputs.NOTES }}" \
            artifacts/CotizacionesApp-Setup-v${{ env.VERSION }}.exe \
            artifacts/CotizacionesApp-v${{ env.VERSION }}.dmg
